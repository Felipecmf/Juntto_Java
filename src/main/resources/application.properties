spring.application.name=juntto-api
# O Render informa a porta pela variável PORT
server.port=${PORT:8080}

# [GS] Conexão com o Oracle: os valores vêm só de variáveis de ambiente (nunca do código)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# [GS] Erros nunca mostram stack trace
server.error.include-stacktrace=never
